<!doctype html><meta charset="utf-8"><title>extractor equivalence</title>
<body style="background:#0f1216;color:#e6eaf0;font:13px ui-monospace,monospace;padding:20px">
<pre id="out">running…</pre>
<script type="module">
import { extract, wire } from "/static/extractor.js";
const out = document.getElementById("out");
const ref = await (await fetch("/static/fixtures/reference.json")).json();
const results = {};
for (const name of Object.keys(ref)) {
  const img = new Image();
  img.src = "/static/fixtures/" + name;
  await img.decode();
  const c = document.createElement("canvas");
  c.width = img.naturalWidth; c.height = img.naturalHeight;
  const cx = c.getContext("2d", { willReadFrequently: true });
  cx.drawImage(img, 0, 0);
  const data = cx.getImageData(0, 0, c.width, c.height);
  results[name] = wire(extract(data, null));
}
out.textContent = JSON.stringify(results, null, 2);
window.__results = results;
</script></body>
